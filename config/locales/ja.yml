# アプリケーション固有の日本語訳
# rails-i18n が日付・時刻・数値フォーマット等を提供
ja:
  # 共通
  "back": "戻る"
  "save": "保存"
  "edit": "編集"
  "delete": "削除"
  "destroy": "削除"
  "show": "表示"
  "new": "新規作成"
  "confirm": "本当に実行しますか？"

  # モデル名
  activerecord:
    models:
      task: "タスク"

    # Taskモデルの属性
    attributes:
      task:
        title: "タイトル"
        content: "内容"
        created_at: "作成日時"
        updated_at: "更新日時"

    errors:
      messages:
        required: "を入力してください"
        taken: "はすでに存在します"
        blank: "を入力してください"
        too_short: "は%{count}文字以上で入力してください"
        too_long: "は%{count}文字以内で入力してください"

  # ビュー用
  views:
    tasks:
      index:
        title: "タスク一覧"
        new_task: "新規タスク"
        no_tasks: "タスクがありません"
      show:
        title: "タスク詳細"
        edit: "このタスクを編集"
        back: "タスク一覧に戻る"
        destroy: "このタスクを削除"
      new:
        title: "新規タスク"
        back: "タスク一覧に戻る"
      edit:
        title: "タスク編集"
        show: "このタスクを表示"
        back: "タスク一覧に戻る"
      form:
        submit_create: "作成する"
        submit_update: "更新する"
      task:
        show: "このタスクを表示"
        edit: "このタスクを編集"
        destroy: "このタスクを削除"

  # フラッシュメッセージ
  notice:
    created: "タスクを作成しました。"
    updated: "タスクを更新しました。"
    destroyed: "タスクを削除しました。"

  # エラーメッセージ
  errors:
    template:
      header:
        one: "%{model}に1件のエラーがあります"
        other: "%{model}に%{count}件のエラーがあります"
