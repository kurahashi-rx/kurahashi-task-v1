# 多言語化定義ファイル ※Springの messages_ja.properties に相当
ja:
  # 汎用的なラベル（ボタン名など）
  "back": "戻る"
  "save": "保存"
  "edit": "編集"
  "delete": "削除"
  "destroy": "削除"
  "show": "表示"
  "new": "新規作成"
  "confirm": "本当に実行しますか？"

  # 列挙型の値
  enums:
    task:
      status:
        todo: "未着手"
        doing: "進行中"
        done: "完了"

  # ActiveRecord (ORM) 関連の定義
  activerecord:
    # モデルの名前
    models:
      task: "タスク"

    # モデルの属性
    attributes:
      task:
        title: "タイトル"
        content: "内容"
        created_at: "作成日時"
        updated_at: "更新日時"

    # バリデーションエラーメッセージ
    errors:
      messages:
        required: "を入力してください"
        taken: "はすでに存在します"
        blank: "を入力してください"
        too_short: "は%{count}文字以上で入力してください"
        too_long: "は%{count}文字以内で入力してください"

  # 画面ごとの文言
  views:
    # タスク関連画面
    tasks:
      index:
        title: "タスク一覧"
        new_task: "新規タスク"
        no_tasks: "タスクがありません"
      show:
        title: "タスク詳細"
        edit: "このタスクを編集"
        back: "タスク一覧に戻る"
        destroy: "このタスクを削除"
      new:
        title: "新規タスク"
        back: "タスク一覧に戻る"
      edit:
        title: "タスク編集"
        show: "このタスクを表示"
        back: "タスク一覧に戻る"
      form:
        submit_create: "作成する"
        submit_update: "更新する"
      task:
        show: "このタスクを表示"
        edit: "このタスクを編集"
        destroy: "このタスクを削除"

  # フラッシュメッセージ
  notice:
    created: "タスクを作成しました。"
    updated: "タスクを更新しました。"
    destroyed: "タスクを削除しました。"

  # エラーメッセージ
  errors:
    template:
      header:
        one: "%{model}に1件のエラーがあります"
        other: "%{model}に%{count}件のエラーがあります"
