# 多言語化定義ファイル
ja:
  # 汎用的なラベル（ボタン名など）
  "back": "戻る"
  "save": "保存"
  "edit": "編集"
  "delete": "削除"
  "destroy": "削除"
  "show": "表示"
  "new": "新規作成"
  "confirm": "本当に実行しますか？"

  # ActiveRecord (ORM) 関連の定義
  activerecord:
    # モデルの名前
    models:
      task: "タスク内容"

    # モデルの属性
    attributes:
      task:
        status: "ステータス"
        category: "分類"
        title: "名称"
        value: "価値"
        definition_of_done: "完了定義"
        procedures: "手順"
        priority_group: "優先度グループ"
        story_point: "ストーリーポイント"
        sort_order: "並べ替え順"
        completed_on: "完了日"

    # バリデーションエラーメッセージ
    errors:
      messages:
        required: "を入力してください"
        taken: "はすでに存在します"
        blank: "を入力してください"
        too_short: "は%{count}文字以上で入力してください"
        too_long: "は%{count}文字以内で入力してください"

    # 列挙型の値
    enums:
      task:
        status:
          backlog: "バックログ"
          ready: "未着手(Ready)"
          sprint: "スプリント中"
          done: "完了"
        priority_group:
          p1: "P1：他者が止まるorリスク高"
          p2: "P2：今日完了で価値あり"
          p3: "P3：明日以降でもよい"
        story_point:
          sp0: "0：雑務"
          sp1: "1：小口化タスク"
          sp3: "3：要思考、やり方不明点なし"
          sp5: "5：厄介、初めてのタスク"
        story_point:
          point_0: "0：雑務"
          point_1: "1：小口化タスク"
          point_3: "3：要思考、やり方不明点なし"
          point_5: "5：厄介、初めてのタスク"

  # 画面ごとの文言
  views:
    # タスク関連画面
    tasks:
      index:
        title: "タスク一覧"
        new_task: "新規タスク"
        no_tasks: "タスクがありません"
      show:
        title: "タスク詳細"
        edit: "このタスクを編集"
        back: "タスク一覧に戻る"
        destroy: "このタスクを削除"
      new:
        title: "新規タスク"
        back: "タスク一覧に戻る"
      edit:
        title: "タスク編集"
        show: "このタスクを表示"
        back: "タスク一覧に戻る"
      form:
        submit_create: "作成する"
        submit_update: "更新する"
      task:
        show: "このタスクを表示"
        edit: "このタスクを編集"
        destroy: "このタスクを削除"

  # フラッシュメッセージ
  notice:
    created: "タスクを作成しました。"
    updated: "タスクを更新しました。"
    destroyed: "タスクを削除しました。"

  # エラーメッセージ
  errors:
    template:
      header:
        one: "%{model}に1件のエラーがあります"
        other: "%{model}に%{count}件のエラーがあります"
